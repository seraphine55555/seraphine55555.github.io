<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>閱讀理解 · 試用版</title>
    <meta
      name="description"
      content="英文閱讀理解試用版：P1–P6 樣本，每題逐個選項解釋。首次載入後可離線使用、毋須帳號。"
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f1b30" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="reading.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">讀</span>
          <span class="brand-text">Reading Lab</span>
        </div>
        <div class="lang-switch" role="group" aria-label="語言 / Language">
          <button type="button" class="lang-btn" data-lang-btn="yue">粵</button>
          <button type="button" class="lang-btn" data-lang-btn="zh">繁</button>
          <button type="button" class="lang-btn" data-lang-btn="en">EN</button>
        </div>
      </header>

      <h1 class="page-title" id="page-title"></h1>
      <p class="page-sub" id="page-sub"></p>

      <div id="app"></div>

      <footer>
        <p id="page-foot"></p>
      </footer>
    </main>

    <script src="../progress.js"></script>
    <script src="../wordlab/data.js"></script>
    <script src="glossary.js"></script>
    <script src="passages.js"></script>
    <script src="notes.js"></script>
    <script src="short.js"></script>
    <script src="app.js"></script>
    <script>
      /* Service Worker：令「首次載入後可離線使用」成立。
         ⚠️ 一定要喺 http(s) 之下；file:// 測試無效。 */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {
            /* 註冊失敗（例如私密模式）唔應該阻住 app 用 */
          });
        });
      }
    </script>
  </body>
</html>
