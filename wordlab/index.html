<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>詞語星球 · WordLab</title>
    <meta
      name="description"
      content="5,000 個英文常用字練習：字卡、配對、快問快答；用間隔重練記住生字。進度只存本機，首次載入後可離線使用。"
    />
    <meta name="theme-color" content="#1b2a4a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="../icons/wordlab.png" />
    <link rel="apple-touch-icon" href="../icons/wordlab.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../" aria-label="返回門戶">
        <span class="brand__mark" aria-hidden="true">詞</span>
        <span>
          <strong>WordLab</strong>
          <small>英文生字</small>
        </span>
      </a>
      <div class="lang" role="group" aria-label="語言 / Language">
        <button type="button" data-lang="yue" aria-pressed="false">粵</button>
        <button type="button" data-lang="zh" aria-pressed="true">繁</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <main id="app" class="wrap" aria-live="polite"></main>

    <footer class="foot">
      <span data-i18n="foot.local"></span>
      <span data-i18n="foot.source"></span>
      <a href="../" data-i18n="foot.hub"></a>
    </footer>

    <script src="../progress.js"></script>
    <script src="data.js"></script>
    <script src="bulk.js"></script>
    <script src="examples-pack1.js"></script>
    <script src="examples-pack2.js"></script>
    <script src="examples-pack3.js"></script>
    <script src="examples-pack4.js"></script>
    <script src="examples-pack5.js"></script>
    <script src="examples-pack6.js"></script>
    <script src="examples-pack7.js"></script>
    <script src="examples-pack8.js"></script>
    <script src="examples-pack9.js"></script>
    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {
          /* 離線快取失敗不影響即時練習。 */
        });
      }
    </script>
  </body>
</html>
