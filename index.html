    <!--
      語言：喺首次繪製之前就要決定，否則會見到「閃一下中文再變英文」。
      預設次序：localStorage → 瀏覽器語言（非中文就英文）→ 書面語。

      三語並存（2026-10-17 用戶決定）：
        粵 = 粵語（原本嘅文案，親切）
        繁 = 繁體書面語（正式，適合學校／老師看）
        en = English
      粵語保留係因為香港家長兩種都有人偏好，而代價只是字典多一欄。
    -->
    <script>
      (function () {
        'use strict';
        var ok = { yue: 1, zh: 1, en: 1 };
        var saved = null;
        try {
          saved = localStorage.getItem('hub/lang');
        } catch (e) {
          /* 私密模式可能 throw，唔緊要 */
        }
        var lang = ok[saved] ? saved : null;
        if (!lang) {
          var nav = (navigator.language || '').toLowerCase();
          lang = nav.indexOf('zh') === 0 ? 'zh' : nav ? 'en' : 'zh';
        }
        document.documentElement.setAttribute('data-lang', lang);
        document.documentElement.lang = lang === 'en' ? 'en' : lang === 'yue' ? 'zh-HK' : 'zh-Hant-HK';
      })();
    </script>

          'install.share': ['分享呢一頁給家長', '分享此頁給家長', 'Share this page with parents'],
          'install.done': [
            '✅ 你已經裝咗 —— 而家用緊主畫面 icon 開呢一頁。',
            '✅ 你已經安裝 —— 現時正透過主畫面圖示開啟此頁。',
            '✅ Already installed — you are opening this page from the home screen icon.',
          ],

          'recruit.h2': ['想幫手測試？', '想協助測試？', 'Want to help test?'],
          'recruit.p1': [
            'Android 版而家喺<b>封閉測試</b>階段。Google 要求我搵到 12 位測試者連續用 14 日，先可以正式上架。',
            'Android 版本現時處於<b>封閉測試</b>階段。Google 要求找到 12 位測試者連續使用 14 日，才可正式上架。',

          'recruit.p2': [

            '如你願意協助：請先加入測試群組，再以<b>同一個</b> Google 帳號於 Play 下載 —— 兩個步驟不可使用不同帳號，否則 Play 會視你為非測試人員。',

          'footer.privacy': ['私隱政策：', '私隱政策：', 'Privacy policy: '],
          'footer.dl': ['讀默', '讀默', '讀默'],
          'footer.ml': ['數練', '數練', '數練'],
          'footer.tracking': [
            '呢一頁同上面所有 app 都唔會追蹤你。',
            '此頁與上方所有應用程式都不會追蹤你。',

        var LANGS = ['yue', 'zh', 'en'];
        var COPY = {
          copied: ['已複製連結 ✓　貼去 WhatsApp 就得', '已複製連結 ✓　可貼到 WhatsApp', 'Link copied ✓ — paste it into WhatsApp'],
          copyFail: ['複製失敗，請長按網址', '複製失敗，請長按網址', 'Copy failed — please long-press the address'],
        };

        function pick(key, lang) {
          var v = DICT[key];
          if (!v) return null;
          var i = LANGS.indexOf(lang);
          return v[i < 0 ? 1 : i];
        }

        function applyLang(lang) {
          if (LANGS.indexOf(lang) < 0) lang = 'zh';
          document.documentElement.setAttribute('data-lang', lang);
          document.documentElement.lang = lang === 'en' ? 'en' : lang === 'yue' ? 'zh-HK' : 'zh-Hant-HK';

          var nodes = document.querySelectorAll('[data-i18n], [data-i18n-html], [data-i18n-alt]');
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            var kText = el.getAttribute('data-i18n');
            var kHtml = el.getAttribute('data-i18n-html');
            var kAlt = el.getAttribute('data-i18n-alt');
            if (kText) {
              var t = pick(kText, lang);
              if (t !== null) el.textContent = t;
            }
            if (kHtml) {
              var h = pick(kHtml, lang);
              /* 只插入本地字典嘅值（唔涉任何用戶輸入），所以 innerHTML 安全 */
              if (h !== null) el.innerHTML = h;
            }
            if (kAlt) {
              var a = pick(kAlt, lang);
              if (a !== null) el.setAttribute('alt', a);
            }
          }

          var btns = document.querySelectorAll('[data-lang-btn]');
          for (var j = 0; j < btns.length; j++) {
            btns[j].setAttribute('aria-pressed', btns[j].getAttribute('data-lang-btn') === lang ? 'true' : 'false');
          }

          try {
            localStorage.setItem('hub/lang', lang);
          } catch (e) {
            /* 私密模式：語言選擇唔會記住，唔緊要 */
          }
        }

        var current = document.documentElement.getAttribute('data-lang') || 'zh';
        applyLang(current);

        var switcher = document.querySelector('.lang-switch');
        if (switcher) {
          switcher.addEventListener('click', function (ev) {
            var btn = ev.target.closest('[data-lang-btn]');
            if (!btn) return;
            applyLang(btn.getAttribute('data-lang-btn'));
          });
        }

        /* ---- 已安裝偵測（主畫面 icon 開）---- */
        var section = document.getElementById('install');
        if (section) {
          var standalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) ||
            window.navigator.standalone === true;
          section.setAttribute('data-installed', standalone ? '1' : '0');
          if (standalone) {
            var done = section.querySelector('.install-done');
            if (done) done.hidden = false;
          }
        }

        /* ---- 分享鍵 ---- */
        var btn = document.getElementById('share-hub');
        if (btn) {
          var LABEL = btn.textContent;
          var HUB_URL = 'https://seraphine55555.github.io/';

          var flash = function (pair) {
            /* COPY 同 DICT 係兩個字典，所以唔可以用 pick()（佢只搵 DICT）——
               用錯就會 set 到 null，按鈕變空白。2026-10-17 守衛捉到。 */
            var lang = document.documentElement.getAttribute('data-lang') || 'zh';
            var idx = LANGS.indexOf(lang);
            btn.textContent = COPY[pair][idx < 0 ? 1 : idx];
            window.setTimeout(function () {
              btn.textContent = pick('install.share', lang);
            }, 2200);
          };

          btn.addEventListener('click', function () {
            var data = {
              title: '香港小學練習 App',
              text: '讀默、數練 —— 離線都用得，毋須帳號、沒有廣告、不會上傳你的資料。',
              url: HUB_URL,
            };

            if (navigator.share) {
              navigator.share(data).catch(function () {
                /* 用戶取消分享：唔算錯，唔好彈任何嘢 */
              });
              return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(HUB_URL).then(
                function () {
                  flash('copied');
                },
                function () {
                  flash('copyFail');
                }
              );
              return;
            }

            flash('copyFail');
          });

          /* 切換語言時，分享鍵標籤由 applyLang 更新，所以呢個變數只為 setTimeout 用 */
          void LABEL;
        }
      })();
    </script>
  </body>
